[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "logicverifier"
version = "1.0.0"
description = "Code and data for the paper 'LLM Verification with a Controllable Error Rate'"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Javier Marín", email = "javier@jmarin.info" }]
requires-python = ">=3.10"
dependencies = ["z3-solver", "scipy", "matplotlib"]

[project.optional-dependencies]
gpu = ["torch", "transformers", "peft", "bitsandbytes", "accelerate", "huggingface_hub", "mistral-common", "vllm", "sentence-transformers"]
judges = ["anthropic", "openai"]
vocabularies = ["rdflib"]

[tool.setuptools.packages.find]
where = ["src"]
